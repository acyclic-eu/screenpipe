name: OysterWorkflow Compatibility CI

on:
  push:
    branches:
      - oysterworkflow-compatible-v0.3.304
  pull_request:
    branches:
      - oysterworkflow-compatible-v0.3.304
  workflow_dispatch:

jobs:
  compatibility:
    name: Source Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check OysterWorkflow compatibility contract
        run: |
          set -euo pipefail

          grep -F "default_values_t = [Language::Chinese, Language::English]" crates/screenpipe-engine/src/cli/mod.rs
          grep -F "pub disable_system_audio: bool" crates/screenpipe-engine/src/cli/mod.rs
          grep -F "enabled: true" crates/screenpipe-engine/src/cli/mod.rs
          grep -F "record_input_events: true" crates/screenpipe-engine/src/cli/mod.rs

          grep -F "test_default_languages_prioritize_chinese_then_english" crates/screenpipe-engine/src/cli/mod.rs
          grep -F "unique_languages_preserves_cli_priority_order" crates/screenpipe-engine/src/cli/mod.rs
          grep -F "test_disable_system_audio_flag_flows_to_recording_settings" crates/screenpipe-engine/src/cli/mod.rs

          grep -F "OysterWorkflow-compatible" README.md
          grep -F "OysterWorkflow 适配版" README-zh_CN.md
          grep -F "Copyright (c) 2024-2026 louis030195" LICENSE.md
          grep -F "https://github.com/mediar-ai/screenpipe" NOTICE
